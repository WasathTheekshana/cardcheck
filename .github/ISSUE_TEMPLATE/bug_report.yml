name: Bug report
description: Something is broken, slow or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not paste a real card number.** A sandbox number or the first few digits is plenty.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: "/, /luhn, /brands, /generator or /code"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari 18 on iPhone 15, Chrome 130 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: webgl
    attributes:
      label: Do you see the 3D card?
      options:
        - Yes, it is 3D
        - I see a flat card
        - I see nothing
        - Not relevant to this bug
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Drag images in here, or paste text from the browser console.
